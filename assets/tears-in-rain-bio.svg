<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 180" width="100%" height="180">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&amp;display=swap');
      .bg { fill: #0d1117; rx: 8px; }
      .border { stroke: #00ff66; stroke-width: 1.5; fill: none; opacity: 0.5; }
      .text {
        font-family: 'Share Tech Mono', monospace;
        font-size: 14px;
        fill: #00ff66;
        filter: drop-shadow(0 0 8px #00ff66);
        animation: glowPulse 2s infinite alternate;
      }
      .attr {
        font-family: 'Share Tech Mono', monospace;
        font-size: 12px;
        font-style: italic;
        fill: #00ff66;
        filter: drop-shadow(0 0 8px #00ff66);
        opacity: 0.7;
      }
      @keyframes glowPulse { 
        0% { filter: drop-shadow(0 0 2px #00ff66); opacity: 0.85; } 
        100% { filter: drop-shadow(0 0 16px #00ff66); opacity: 1; } 
      }
    </style>
  </defs>
  <rect width="800" height="180" class="bg" />
  <rect x="2" y="2" width="796" height="176" class="border" />
  
  <text x="30" y="35" class="text">"I've seen things you people wouldn't believe.</text>
  <text x="30" y="55" class="text">Attack ships on fire off the shoulder of Orion.</text>
  <text x="30" y="75" class="text">I watched C-beams glitter in the dark near</text>
  <text x="30" y="95" class="text">the Tannhäuser Gate. All those moments will be</text>
  <text x="30" y="115" class="text">lost in time, like tears in rain. Time to die."</text>
  
  <text x="680" y="155" class="attr">- Roy Batty, Blade Runner</text>
</svg>
