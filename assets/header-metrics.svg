<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 50" width="100%" height="50">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&amp;display=swap');
      .text {
        font-family: 'Share Tech Mono', monospace;
        font-size: 16px;
        fill: #00ff66;
        filter: drop-shadow(0 0 8px #00ff66);
      }
      .typing {
        display: inline-block;
        overflow: hidden;
        white-space: nowrap;
        border-right: 2px solid #00ff66;
        animation: typing 3s steps(30, end) forwards, blink 0.75s step-end infinite;
      }
      @keyframes typing { from { width: 0; } to { width: 100%; } }
      @keyframes blink { from, to { border-color: transparent; } 50% { border-color: #00ff66; } }
    </style>
  </defs>
  <text x="0" y="32" class="text"><tspan class="typing">💾 [ SYSTEM_METRICS &amp; TELEMETRY ]</tspan></text>
</svg>
