<svg width="850" height="150" viewBox="0 0 850 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Phosphor Neon Glow Filter -->
    <filter id="o-glow-multi" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Scanline Pattern -->
    <pattern id="o-scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#00FF66" stroke-opacity="0.04" stroke-width="1.2" />
    </pattern>

    <!-- Background Chassis Gradient -->
    <linearGradient id="o-chassis-grad" x1="0" y1="0" x2="850" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#02080a"/>
      <stop offset="50%" stop-color="#051014"/>
      <stop offset="100%" stop-color="#010608"/>
    </linearGradient>

    <!-- Glowing Cyber Border Gradient -->
    <linearGradient id="o-border-grad" x1="0" y1="0" x2="850" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="35%" stop-color="#00FF66"/>
      <stop offset="70%" stop-color="#FF007F"/>
      <stop offset="100%" stop-color="#FFD700"/>
    </linearGradient>

    <!-- Waveform Path Gradient -->
    <linearGradient id="o-wave-grad" x1="0" y1="0" x2="800" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00FF66"/>
      <stop offset="50%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#FF007F"/>
    </linearGradient>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;family=VT323&amp;display=swap');

    .hdr-title {
      font-family: 'Press Start 2P', monospace;
      font-size: 10.5px;
      fill: #00FF66;
      letter-spacing: 0.8px;
      filter: url(#o-glow-multi);
    }

    .tel-lbl {
      font-family: 'VT323', monospace;
      font-size: 19px;
      letter-spacing: 1px;
    }

    .c-green { fill: #00FF66; filter: url(#o-glow-multi); }
    .c-cyan { fill: #00F0FF; }
  </style>

  <!-- Outer Frame -->
  <rect x="2" y="2" width="846" height="146" rx="8" fill="url(#o-chassis-grad)" stroke="url(#o-border-grad)" stroke-width="2"/>
  <rect x="2" y="2" width="846" height="146" rx="8" fill="url(#o-scanlines)"/>

  <!-- Title Header Bar -->
  <path d="M 2 8 Q 2 2 8 2 L 842 2 Q 848 2 848 8 L 848 28 L 2 28 Z" fill="#011718" stroke="#00FF66" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="2" y1="28" x2="848" y2="28" stroke="url(#o-border-grad)" stroke-width="1.4"/>

  <!-- Status LEDs -->
  <circle cx="16" cy="15" r="4" fill="#FF0055"/>
  <circle cx="28" cy="15" r="4" fill="#FFD700"/>
  <circle cx="40" cy="15" r="4" fill="#00FF66"/>

  <text x="425" y="19" text-anchor="middle" class="hdr-title">[ PANEL 03: REAL-TIME ACTIVITY FREQUENCY OSCILLOSCOPE ]</text>

  <!-- Waveform Grid Lines -->
  <line x1="22" y1="88" x2="828" y2="88" stroke="#00FF66" stroke-opacity="0.18" stroke-dasharray="4,4"/>
  <line x1="22" y1="60" x2="828" y2="60" stroke="#00F0FF" stroke-opacity="0.18" stroke-dasharray="4,4"/>
  <line x1="22" y1="116" x2="828" y2="116" stroke="#FF007F" stroke-opacity="0.18" stroke-dasharray="4,4"/>

  <!-- Waveform Graph Path -->
  <path d="M 35 120 Q 75 58 115 88 T 195 55 T 275 110 T 355 52 T 435 100 T 515 58 T 595 105 T 675 50 T 755 90 L 810 65" 
        fill="none" stroke="url(#o-wave-grad)" stroke-width="3" filter="url(#o-glow-multi)"/>

  <!-- Pulsing Waveform Data Nodes -->
  <circle cx="115" cy="88" r="4" fill="#00FF66" filter="url(#o-glow-multi)"/>
  <circle cx="195" cy="55" r="4" fill="#00F0FF"/>
  <circle cx="355" cy="52" r="5" fill="#FF007F"/>
  <circle cx="515" cy="58" r="4" fill="#00FF66"/>
  <circle cx="675" cy="50" r="5" fill="#FFD700"/>

  <text x="815" y="138" text-anchor="end" class="tel-lbl c-cyan">2026 CONTINUOUS SPRINT • 100% CLOUD UPTIME</text>
</svg>
