<svg width="850" height="235" viewBox="0 0 850 235" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Phosphor Neon Glow Filter -->
    <filter id="o-glow-multi" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="o-glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Scanline Pattern -->
    <pattern id="o-scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#00FF66" stroke-opacity="0.04" stroke-width="1.2" />
    </pattern>

    <!-- Background Chassis Gradient -->
    <linearGradient id="o-chassis-grad" x1="0" y1="0" x2="850" y2="235" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#02080a"/>
      <stop offset="50%" stop-color="#051016"/>
      <stop offset="100%" stop-color="#010608"/>
    </linearGradient>

    <!-- Glowing Cyber Border Gradient -->
    <linearGradient id="o-border-grad" x1="0" y1="0" x2="850" y2="235" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="35%" stop-color="#00FF66"/>
      <stop offset="70%" stop-color="#FF007F"/>
      <stop offset="100%" stop-color="#FFD700"/>
    </linearGradient>

    <!-- Waveform Path Gradient -->
    <linearGradient id="o-wave-grad" x1="0" y1="0" x2="800" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00FF66"/>
      <stop offset="50%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#FF007F"/>
    </linearGradient>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;family=VT323&amp;display=swap');

    .hdr-title {
      font-family: 'Press Start 2P', monospace;
      font-size: 11px;
      fill: #00FF66;
      letter-spacing: 1px;
      filter: url(#o-glow-multi);
    }

    .box-sub {
      font-family: 'Press Start 2P', monospace;
      font-size: 9.5px;
      fill: #00F0FF;
      letter-spacing: 0.8px;
    }

    .tel-lbl {
      font-family: 'VT323', monospace;
      font-size: 19px;
      letter-spacing: 1px;
    }

    .c-green { fill: #00FF66; filter: url(#o-glow-multi); }
    .c-cyan { fill: #00F0FF; filter: url(#o-glow-cyan); }
    .c-magenta { fill: #FF007F; }
    .c-amber { fill: #FFD700; }
  </style>

  <!-- Outer Frame -->
  <rect x="2" y="2" width="846" height="231" rx="8" fill="url(#o-chassis-grad)" stroke="url(#o-border-grad)" stroke-width="2"/>
  <rect x="2" y="2" width="846" height="231" rx="8" fill="url(#o-scanlines)"/>

  <!-- Title Header Bar -->
  <path d="M 2 8 Q 2 2 8 2 L 842 2 Q 848 2 848 8 L 848 30 L 2 30 Z" fill="#011718" stroke="#00FF66" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="2" y1="30" x2="848" y2="30" stroke="url(#o-border-grad)" stroke-width="1.5"/>

  <!-- Status LEDs -->
  <circle cx="16" cy="16" r="4" fill="#FF0055"/>
  <circle cx="28" cy="16" r="4" fill="#FFD700"/>
  <circle cx="40" cy="16" r="4" fill="#00FF66" filter="url(#o-glow-multi)"/>

  <text x="425" y="20" text-anchor="middle" class="hdr-title">[ PANEL 03: REAL-TIME ACTIVITY FREQUENCY OSCILLOSCOPE ]</text>

  <!-- Oscilloscope Screen Inset -->
  <rect x="20" y="44" width="810" height="175" rx="6" fill="#010e0c" stroke="#00FF66" stroke-width="1.2" stroke-opacity="0.5"/>
  
  <text x="35" y="65" class="box-sub">▼ [ACTIVITY OSCILLOGRAM // FREQUENCY: 1.54K COMMITS SPRINT]</text>

  <!-- Oscilloscope Grid Lines (Spacious & Clean) -->
  <line x1="20" y1="95" x2="830" y2="95" stroke="#00F0FF" stroke-opacity="0.14" stroke-dasharray="4,4"/>
  <line x1="20" y1="130" x2="830" y2="130" stroke="#00FF66" stroke-opacity="0.2" stroke-dasharray="4,4"/>
  <line x1="20" y1="165" x2="830" y2="165" stroke="#FF007F" stroke-opacity="0.14" stroke-dasharray="4,4"/>

  <!-- Vertical Grid Hash Marks -->
  <line x1="170" y1="44" x2="170" y2="219" stroke="#00FF66" stroke-opacity="0.08" stroke-dasharray="2,4"/>
  <line x1="335" y1="44" x2="335" y2="219" stroke="#00FF66" stroke-opacity="0.08" stroke-dasharray="2,4"/>
  <line x1="500" y1="44" x2="500" y2="219" stroke="#00FF66" stroke-opacity="0.08" stroke-dasharray="2,4"/>
  <line x1="665" y1="44" x2="665" y2="219" stroke="#00FF66" stroke-opacity="0.08" stroke-dasharray="2,4"/>

  <!-- Oscilloscope Waveform Graph Path (Full Amplitude, Spacious Wave) -->
  <path d="M 35 168 Q 75 88 115 130 T 195 82 T 275 162 T 355 78 T 435 142 T 515 85 T 595 158 T 675 75 T 755 135 L 815 95" 
        fill="none" stroke="url(#o-wave-grad)" stroke-width="3.2" filter="url(#o-glow-multi)"/>

  <!-- Pulsing Waveform Data Nodes -->
  <circle cx="115" cy="130" r="4.5" fill="#00FF66" filter="url(#o-glow-multi)"/>
  <circle cx="195" cy="82" r="4.5" fill="#00F0FF" filter="url(#o-glow-cyan)"/>
  <circle cx="355" cy="78" r="5.5" fill="#FF007F"/>
  <circle cx="515" cy="85" r="4.5" fill="#00FF66" filter="url(#o-glow-multi)"/>
  <circle cx="675" cy="75" r="5.5" fill="#FFD700"/>

  <!-- Oscilloscope Telemetry Footer -->
  <text x="35" y="206" class="tel-lbl c-cyan">&gt;&gt; SIGNAL: 100% UPTIME • 189/189 SUITES PASSING</text>
  <text x="815" y="206" text-anchor="end" class="tel-lbl c-green">2026 CONTINUOUS SPRINT ACTIVE &gt;&gt;</text>
</svg>
