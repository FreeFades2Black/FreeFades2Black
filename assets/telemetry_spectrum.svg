<svg width="850" height="210" viewBox="0 0 850 210" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Phosphor Neon Glow Filter -->
    <filter id="s-glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="s-glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="s-glow-magenta" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="s-glow-amber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Scanline Pattern -->
    <pattern id="s-scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#00F0FF" stroke-opacity="0.04" stroke-width="1.2" />
    </pattern>

    <!-- Background Chassis Gradient -->
    <linearGradient id="s-chassis-grad" x1="0" y1="0" x2="850" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#02080e"/>
      <stop offset="50%" stop-color="#04121c"/>
      <stop offset="100%" stop-color="#01060a"/>
    </linearGradient>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;family=VT323&amp;display=swap');

    .hdr-title {
      font-family: 'Press Start 2P', monospace;
      font-size: 11px;
      fill: #00F0FF;
      letter-spacing: 1px;
      filter: url(#s-glow-cyan);
    }

    .tel-lbl {
      font-family: 'VT323', monospace;
      font-size: 20px;
      letter-spacing: 1.2px;
    }

    .tel-bar {
      font-family: 'VT323', monospace;
      font-size: 20px;
      letter-spacing: 1.2px;
    }

    .tel-val {
      font-family: 'VT323', monospace;
      font-size: 19px;
      fill: #E2E8F0;
      letter-spacing: 0.9px;
    }

    .c-cyan { fill: #00F0FF; filter: url(#s-glow-cyan); }
    .c-green { fill: #00FF66; filter: url(#s-glow-green); }
    .c-magenta { fill: #FF007F; filter: url(#s-glow-magenta); }
    .c-amber { fill: #FFD700; filter: url(#s-glow-amber); }
    .c-white { fill: #FFFFFF; }
  </style>

  <!-- Outer Frame -->
  <rect x="2" y="2" width="846" height="206" rx="8" fill="url(#s-chassis-grad)" stroke="#00F0FF" stroke-width="2" filter="url(#s-glow-cyan)"/>
  <rect x="2" y="2" width="846" height="206" rx="8" fill="url(#s-scanlines)"/>

  <!-- Title Header Bar -->
  <path d="M 2 8 Q 2 2 8 2 L 842 2 Q 848 2 848 8 L 848 30 L 2 30 Z" fill="#021c2b" stroke="#00F0FF" stroke-width="1" stroke-opacity="0.4"/>
  <line x1="2" y1="30" x2="848" y2="30" stroke="#00F0FF" stroke-width="1.5"/>

  <!-- Status LEDs -->
  <circle cx="16" cy="16" r="4" fill="#FF0055"/>
  <circle cx="28" cy="16" r="4" fill="#FFD700"/>
  <circle cx="40" cy="16" r="4" fill="#00F0FF" filter="url(#s-glow-cyan)"/>

  <text x="425" y="20" text-anchor="middle" class="hdr-title">[ PANEL 02: CODEBASE TECHNOLOGY SPECTRUM ]</text>

  <!-- Tech 1: Python -->
  <g transform="translate(35, 66)">
    <text x="0" y="0" class="tel-lbl c-white">&gt; PYTHON / FASTAPI</text>
    <text x="180" y="0" class="tel-bar c-cyan">[████████████████] 48.5%</text>
    <text x="390" y="0" class="tel-val">CORE ENGINE, ML TENSORS &amp; REST APIS</text>
  </g>

  <!-- Tech 2: PySpark -->
  <g transform="translate(35, 102)">
    <text x="0" y="0" class="tel-lbl c-white">&gt; PYSPARK / SQL / UC</text>
    <text x="180" y="0" class="tel-bar c-green">[██████████     ] 28.0%</text>
    <text x="390" y="0" class="tel-val">LAKEHOUSE, DELTA LAKE &amp; UNITY CATALOG</text>
  </g>

  <!-- Tech 3: Terraform -->
  <g transform="translate(35, 138)">
    <text x="0" y="0" class="tel-lbl c-white">&gt; TERRAFORM / AWS</text>
    <text x="180" y="0" class="tel-bar c-magenta">[█████          ] 14.5%</text>
    <text x="390" y="0" class="tel-val">MULTI-CLOUD IAC (AWS, GCP, DATABRICKS)</text>
  </g>

  <!-- Tech 4: PowerShell -->
  <g transform="translate(35, 174)">
    <text x="0" y="0" class="tel-lbl c-white">&gt; POWERSHELL / BASH</text>
    <text x="180" y="0" class="tel-bar c-amber">[███            ]  9.0%</text>
    <text x="390" y="0" class="tel-val">WINDOWS FLEET &amp; LINUX DAEMON AUTOMATION</text>
  </g>
</svg>
