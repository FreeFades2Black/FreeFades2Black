<svg width="850" height="230" viewBox="0 0 850 230" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Phosphor CRT Green Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- CRT Horizontal Scanlines Overlay -->
    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#00FF66" stroke-opacity="0.05" stroke-width="1.5" />
    </pattern>

    <!-- Terminal Obsidian Chassis Gradient -->
    <linearGradient id="terminal-grad" x1="0" y1="0" x2="850" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#020804"/>
      <stop offset="50%" stop-color="#031206"/>
      <stop offset="100%" stop-color="#010603"/>
    </linearGradient>

    <!-- Staggered Typewriter Clip Paths (Compact Font Scaling) -->
    <clipPath id="clip-line1">
      <rect x="30" y="44" width="0" height="28">
        <animate attributeName="width" values="0;0;790;790;790;0" keyTimes="0;0.02;0.18;0.92;0.98;1" dur="12s" repeatCount="indefinite"/>
      </rect>
    </clipPath>

    <clipPath id="clip-line2">
      <rect x="30" y="80" width="0" height="28">
        <animate attributeName="width" values="0;0;790;790;790;0" keyTimes="0;0.22;0.38;0.92;0.98;1" dur="12s" repeatCount="indefinite"/>
      </rect>
    </clipPath>

    <clipPath id="clip-line3">
      <rect x="30" y="116" width="0" height="28">
        <animate attributeName="width" values="0;0;790;790;790;0" keyTimes="0;0.42;0.58;0.92;0.98;1" dur="12s" repeatCount="indefinite"/>
      </rect>
    </clipPath>

    <clipPath id="clip-line4">
      <rect x="30" y="152" width="0" height="28">
        <animate attributeName="width" values="0;0;790;790;790;0" keyTimes="0;0.62;0.78;0.92;0.98;1" dur="12s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;family=VT323&amp;display=swap');

    .term-title {
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      fill: #00FF9D;
      letter-spacing: 0.5px;
    }

    .term-text {
      font-family: 'Press Start 2P', monospace;
      font-size: 12.5px;
      fill: #00FF66;
      filter: url(#neon-glow);
      letter-spacing: 0.8px;
    }

    .cursor {
      fill: #00FF66;
      filter: url(#neon-glow);
    }
  </style>

  <!-- CRT Monitor Outer Frame -->
  <rect x="2" y="2" width="846" height="226" rx="6" fill="url(#terminal-grad)" stroke="#00FF66" stroke-width="1.8" stroke-opacity="0.85" filter="url(#neon-glow)"/>
  
  <!-- CRT Scanlines Texture -->
  <rect x="2" y="2" width="846" height="226" rx="6" fill="url(#scanlines)" />

  <!-- CRT Title Header -->
  <path d="M 2 8 Q 2 2 8 2 L 842 2 Q 848 2 848 8 L 848 28 L 2 28 Z" fill="#021a08" stroke="#00FF66" stroke-width="1" stroke-opacity="0.4"/>
  <line x1="2" y1="28" x2="848" y2="28" stroke="#00FF66" stroke-width="1.2" stroke-opacity="0.7"/>

  <!-- Vintage CRT Status LEDs -->
  <circle cx="16" cy="15" r="4" fill="#FF5F56" />
  <circle cx="28" cy="15" r="4" fill="#FFBD2E" />
  <circle cx="40" cy="15" r="4" fill="#27C93F" />

  <!-- CRT Window Title -->
  <text x="425" y="18" text-anchor="middle" class="term-title">[ GUNSLINGER-19 // SPECIAL FORCES COMMAND INTERFACE ]</text>

  <!-- Staggered Multi-Line Terminal Output -->
  <!-- Line 1 -->
  <g clip-path="url(#clip-line1)">
    <text x="35" y="64" class="term-text">&gt; C:\&gt; LOAD "OPERATOR_18Z.BIN",8,1 ... [READY]</text>
  </g>

  <!-- Line 2 -->
  <g clip-path="url(#clip-line2)">
    <text x="35" y="100" class="term-text">&gt; WILLIAM FREE HALL • SOLUTIONS ARCHITECT</text>
  </g>

  <!-- Line 3 -->
  <g clip-path="url(#clip-line3)">
    <text x="35" y="136" class="term-text">&gt; US ARMY SPECIAL FORCES (RET) • 7 EAGLE GROUP</text>
  </g>

  <!-- Line 4 -->
  <g clip-path="url(#clip-line4)">
    <text x="35" y="172" class="term-text">&gt; [SYS ONLINE] 189/189 TESTS OK • CLOUD &amp; DATA</text>
  </g>

  <!-- Blinking Terminal Cursor -->
  <rect x="660" y="158" width="10" height="15" class="cursor">
    <animate attributeName="opacity" values="1;0;1" dur="0.75s" repeatCount="indefinite"/>
  </rect>
</svg>
