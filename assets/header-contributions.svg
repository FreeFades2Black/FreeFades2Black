<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 50" width="100%" height="50">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&amp;display=swap');
      .text {
        font-family: 'Share Tech Mono', monospace;
        font-size: 16px;
        fill: #00ff66;
        filter: drop-shadow(0 0 8px #00ff66);
      }
      .typing {
        display: inline-block;
        overflow: hidden;
        white-space: nowrap;
        border-right: 2px solid #00ff66;
        width: 0;
        animation: typing 2s steps(42, end) 9.4s forwards, blink 0.75s step-end infinite, glowPulse 2s infinite alternate;
      }
      @keyframes typing { from { width: 0; } to { width: 100%; } }
      @keyframes blink { from, to { border-color: transparent; } 50% { border-color: #00ff66; } }
      @keyframes glowPulse { 0% { filter: drop-shadow(0 0 2px #00ff66); } 100% { filter: drop-shadow(0 0 14px #00ff66); } }
    </style>
  </defs>
  <text x="0" y="32" class="text"><tspan class="typing">📈 [ CONTRIBUTION_MATRIX // ACTIVITY_GRID ]</tspan></text>
</svg>
