<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 60" width="100%" height="60">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&amp;display=swap');
      .bg { fill: #0d1117; rx: 6px; }
      .border { stroke: #00ff66; stroke-width: 1.5; fill: none; opacity: 0.6; }
      .text {
        font-family: 'Share Tech Mono', monospace;
        font-size: 18px;
        fill: #00ff66;
        filter: drop-shadow(0 0 8px #00ff66);
      }
      .typing {
        display: inline-block;
        overflow: hidden;
        white-space: nowrap;
        border-right: 2px solid #00ff66;
        width: 0;
        animation: typing 2.5s steps(38, end) 0.2s forwards, blink 0.75s step-end infinite, glowPulse 2s infinite alternate;
      }
      @keyframes typing { from { width: 0; } to { width: 100%; } }
      @keyframes blink { from, to { border-color: transparent; } 50% { border-color: #00ff66; } }
      @keyframes glowPulse { 0% { filter: drop-shadow(0 0 2px #00ff66); } 100% { filter: drop-shadow(0 0 14px #00ff66); } }
    </style>
  </defs>
  <rect width="800" height="60" class="bg" />
  <rect x="2" y="2" width="796" height="56" class="border" />
  <text x="400" y="37" text-anchor="middle" class="text">
    <tspan class="typing">[ SYSTEM_ONLINE // NETRUNNER_INITIALIZED ]</tspan>
  </text>
</svg>
