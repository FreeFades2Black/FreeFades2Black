<svg width="850" height="465" viewBox="0 0 850 465" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Multi-Color Neon Phosphor Glow Filters -->
    <filter id="glow-green-tel" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glow-cyan-tel" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glow-magenta-tel" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glow-amber-tel" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Scanline Pattern for CRT Screen -->
    <pattern id="telemetry-scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#00FF66" stroke-opacity="0.04" stroke-width="1.2" />
    </pattern>

    <!-- Deep Synthwave Chassis Gradient -->
    <linearGradient id="chassis-grad-tel" x1="0" y1="0" x2="850" y2="465" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#02080a"/>
      <stop offset="50%" stop-color="#041214"/>
      <stop offset="100%" stop-color="#010608"/>
    </linearGradient>

    <!-- Glowing Cyber Border Gradient -->
    <linearGradient id="neon-border-tel" x1="0" y1="0" x2="850" y2="465" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="35%" stop-color="#00FF66"/>
      <stop offset="70%" stop-color="#FF007F"/>
      <stop offset="100%" stop-color="#FFD700"/>
    </linearGradient>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;family=VT323&amp;display=swap');

    .tel-hdr {
      font-family: 'Press Start 2P', monospace;
      font-size: 11px;
      fill: #00FF66;
      letter-spacing: 1px;
      filter: url(#glow-green-tel);
    }

    .box-title {
      font-family: 'Press Start 2P', monospace;
      font-size: 10.5px;
      letter-spacing: 0.8px;
    }

    .tel-lbl {
      font-family: 'VT323', monospace;
      font-size: 20px;
      letter-spacing: 1.2px;
    }

    .tel-bar {
      font-family: 'VT323', monospace;
      font-size: 20px;
      letter-spacing: 1.2px;
    }

    .tel-val {
      font-family: 'VT323', monospace;
      font-size: 19px;
      fill: #E2E8F0;
      letter-spacing: 0.9px;
    }

    .c-green { fill: #00FF66; filter: url(#glow-green-tel); }
    .c-cyan { fill: #00F0FF; filter: url(#glow-cyan-tel); }
    .c-magenta { fill: #FF007F; filter: url(#glow-magenta-tel); }
    .c-amber { fill: #FFD700; filter: url(#glow-amber-tel); }
    .c-white { fill: #FFFFFF; }

    .pulse-box {
      animation: chassisPulse 3.5s ease-in-out infinite alternate;
    }

    @keyframes chassisPulse {
      0% { opacity: 0.9; }
      100% { opacity: 1; }
    }
  </style>

  <!-- Glowing Mainframe Outer Frame -->
  <rect x="2" y="2" width="846" height="461" rx="8" fill="url(#chassis-grad-tel)" stroke="url(#neon-border-tel)" stroke-width="2" class="pulse-box"/>
  
  <!-- CRT Scanlines -->
  <rect x="2" y="2" width="846" height="461" rx="8" fill="url(#telemetry-scanlines)" />

  <!-- Window Header Bar -->
  <path d="M 2 8 Q 2 2 8 2 L 842 2 Q 848 2 848 8 L 848 32 L 2 32 Z" fill="#021714" stroke="#00FF66" stroke-width="1" stroke-opacity="0.4"/>
  <line x1="2" y1="32" x2="848" y2="32" stroke="url(#neon-border-tel)" stroke-width="1.5"/>

  <!-- Vintage CRT LEDs -->
  <circle cx="18" cy="17" r="4.5" fill="#FF0055" filter="url(#glow-magenta-tel)"/>
  <circle cx="32" cy="17" r="4.5" fill="#FFD700" filter="url(#glow-amber-tel)"/>
  <circle cx="46" cy="17" r="4.5" fill="#00FF66" filter="url(#glow-green-tel)"/>
  <circle cx="60" cy="17" r="4.5" fill="#00F0FF" filter="url(#glow-cyan-tel)"/>

  <!-- Mainframe Title Text -->
  <text x="445" y="21" text-anchor="middle" class="tel-hdr">[ MAINFRAME TELEMETRY // REAL-TIME PERFORMANCE RADAR ]</text>

  <!-- ========================================================================= -->
  <!-- BOX 1: CORE SYSTEM METRICS & VELOCITY                                     -->
  <!-- ========================================================================= -->
  <rect x="22" y="48" width="806" height="175" rx="6" fill="#010e0c" stroke="#00FF66" stroke-width="1.6" filter="url(#glow-green-tel)"/>
  <text x="38" y="72" class="box-title c-green">▼ [PANEL 01: CORE SYSTEM METRICS &amp; ACTIVITY VELOCITY]</text>

  <!-- Metric 1: Commits -->
  <g transform="translate(38, 104)">
    <text x="0" y="0" class="tel-lbl c-cyan">&gt; TOTAL COMMITS</text>
    <text x="180" y="0" class="tel-bar c-green">[████████████████████]</text>
    <text x="390" y="0" class="tel-val">3,080+ COMMITS • TOP 1% GLOBAL SPRINT</text>
  </g>

  <!-- Metric 2: Streak -->
  <g transform="translate(38, 136)">
    <text x="0" y="0" class="tel-lbl c-cyan">&gt; ACTIVE STREAK</text>
    <text x="180" y="0" class="tel-bar c-magenta">[████████████████████]</text>
    <text x="390" y="0" class="tel-val">90+ DAYS CONTINUOUS INTEGRATION (CI/CD)</text>
  </g>

  <!-- Metric 3: Tests -->
  <g transform="translate(38, 168)">
    <text x="0" y="0" class="tel-lbl c-cyan">&gt; TEST COVERAGE</text>
    <text x="180" y="0" class="tel-bar c-green">[████████████████████]</text>
    <text x="390" y="0" class="tel-val">232 / 232 TEST SUITES PASSED (100% RELIABLE)</text>
  </g>

  <!-- Metric 4: Defense -->
  <g transform="translate(38, 200)">
    <text x="0" y="0" class="tel-lbl c-cyan">&gt; DEFENSE NETWORK</text>
    <text x="180" y="0" class="tel-bar c-amber">[████████████████████]</text>
    <text x="390" y="0" class="tel-val">71 MOS • 35 BASE CLUSTERS • 50 STATES</text>
  </g>

  <!-- ========================================================================= -->
  <!-- BOX 2: CODEBASE TECHNOLOGY SPECTRUM                                       -->
  <!-- ========================================================================= -->
  <rect x="22" y="245" width="806" height="175" rx="6" fill="#010c14" stroke="#00F0FF" stroke-width="1.6" filter="url(#glow-cyan-tel)"/>
  <text x="38" y="269" class="box-title c-cyan">▼ [PANEL 02: CODEBASE TECHNOLOGY SPECTRUM &amp; DISTRIBUTION]</text>

  <!-- Tech 1: Python -->
  <g transform="translate(38, 301)">
    <text x="0" y="0" class="tel-lbl c-white">&gt; PYTHON / FASTAPI</text>
    <text x="180" y="0" class="tel-bar c-cyan">[████████████████] 48.5%</text>
    <text x="390" y="0" class="tel-val">CORE ENGINE, ML TENSORS &amp; REST APIS</text>
  </g>

  <!-- Tech 2: PySpark -->
  <g transform="translate(38, 333)">
    <text x="0" y="0" class="tel-lbl c-white">&gt; PYSPARK / SQL / UC</text>
    <text x="180" y="0" class="tel-bar c-green">[██████████     ] 28.0%</text>
    <text x="390" y="0" class="tel-val">LAKEHOUSE, DELTA LAKE &amp; UNITY CATALOG</text>
  </g>

  <!-- Tech 3: Terraform -->
  <g transform="translate(38, 365)">
    <text x="0" y="0" class="tel-lbl c-white">&gt; TERRAFORM / AWS</text>
    <text x="180" y="0" class="tel-bar c-magenta">[█████          ] 14.5%</text>
    <text x="390" y="0" class="tel-val">MULTI-CLOUD IAC (AWS, GCP, DATABRICKS)</text>
  </g>

  <!-- Tech 4: PowerShell -->
  <g transform="translate(38, 397)">
    <text x="0" y="0" class="tel-lbl c-white">&gt; POWERSHELL / BASH</text>
    <text x="180" y="0" class="tel-bar c-amber">[███            ]  9.0%</text>
    <text x="390" y="0" class="tel-val">WINDOWS FLEET &amp; LINUX DAEMON AUTOMATION</text>
  </g>
</svg>
