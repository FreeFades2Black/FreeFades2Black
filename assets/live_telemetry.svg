<svg xmlns="http://www.w3.org/2000/svg" width="850" height="145" viewBox="0 0 850 145">
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0a0e17"/>
            <stop offset="100%" stop-color="#121824"/>
        </linearGradient>
        <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#00ffcc" stop-opacity="0.3"/>
            <stop offset="50%" stop-color="#ff007f" stop-opacity="1"/>
            <stop offset="100%" stop-color="#00ffcc" stop-opacity="0.9"/>
        </linearGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="2" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    <style>
        .hud-title { font-family: 'Courier New', monospace; fill: #00ffcc; font-size: 13px; font-weight: bold; letter-spacing: 1px; }
        .hud-data { font-family: 'Courier New', monospace; fill: #e6edf3; font-size: 12px; }
        .hud-highlight { font-family: 'Courier New', monospace; fill: #39d353; font-weight: bold; font-size: 13px; }
        .hud-time { font-family: 'Courier New', monospace; fill: #00f0ff; font-weight: bold; font-size: 12px; }
        .hud-meta { font-family: 'Courier New', monospace; fill: #8b949e; font-size: 11px; }
        .pulse { stroke: url(#waveGrad); stroke-width: 2.5; fill: none; filter: url(#glow); }
        .grid-line { stroke: #1f293d; stroke-width: 0.8; stroke-dasharray: 4 4; }
        .badge-box { fill: #070a0f; stroke: #238636; stroke-width: 1; }
    </style>
    
    <!-- Outer Container -->
    <rect width="100%" height="100%" fill="url(#bgGrad)" rx="8" stroke="#30363d" stroke-width="1.5"/>
    
    <!-- Grid Overlay -->
    <line x1="20" y1="35" x2="830" y2="35" class="grid-line"/>
    <line x1="20" y1="68" x2="830" y2="68" class="grid-line"/>
    <line x1="20" y1="102" x2="830" y2="102" class="grid-line"/>
    <line x1="490" y1="10" x2="490" y2="135" class="grid-line"/>
    
    <!-- Header Row -->
    <circle cx="35" cy="22" r="4" fill="#39d353" filter="url(#glow-green)"/>
    <text x="48" y="26" class="hud-title">[ TELEMETRY LINK: ACTIVE • PROTOCOL 19 ]</text>
    
    <!-- Telemetry Readouts Left Column -->
    <text x="35" y="55" class="hud-data">COMMITS LOGGED : </text>
    <text x="175" y="55" class="hud-highlight">2,730+</text>
    
    <text x="35" y="86" class="hud-data">SYSTEM PIPELINE: </text>
    <text x="175" y="86" class="hud-title" fill="#00ffcc">100% OPERATIONAL [232 TESTS PASS]</text>
    
    <!-- Prominent Date & Time of Last Update Banner -->
    <rect x="35" y="112" width="440" height="22" rx="4" class="badge-box"/>
    <text x="45" y="127" class="hud-data">LAST SYNCED : </text>
    <text x="155" y="127" class="hud-time">Sep 05, 2026 | 14:27:13 UTC</text>
    
    <!-- Oscilloscope Waveform Right Column -->
    <rect x="505" y="16" width="325" height="113" rx="4" fill="#070a0f" stroke="#21262d" stroke-width="1"/>
    <text x="520" y="34" class="hud-meta">SIGNAL: HIGH-FREQUENCY TELEMETRY</text>
    <path d="M 515 75 Q 540 45, 565 75 T 615 75 Q 635 20, 655 75 T 705 75 Q 730 120, 755 75 T 805 75" class="pulse"/>
    
    <!-- Status Indicator Corner -->
    <text x="770" y="120" class="hud-meta" fill="#39d353">LIVE 🟢</text>
</svg>